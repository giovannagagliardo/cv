name: Build LaTeX CV
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV_Giovanna_Gagliardo
          path: cv.pdf
